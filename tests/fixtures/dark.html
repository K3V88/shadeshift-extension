<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Native dark fixture</title>
    <style>
      html,
      body {
        background: #15151b;
        color: #eee;
        margin: 0;
        min-height: 100vh;
        font: 20px system-ui;
      }
      main {
        padding: 50px;
      }
      .card {
        background: #252531;
        padding: 30px;
      }
      button {
        background: white;
        color: black;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Already dark by design</h1>
      <p>A native theme should remain exactly as its publisher intended.</p>
      <div class="card">
        A dark elevated card <button>Small light button</button>
      </div>
    </main>
  </body>
</html>
