<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mixed fixture</title>
    <style>
      body {
        margin: 0;
        font: 20px system-ui;
      }
      section {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 50%;
        padding: 30px;
        box-sizing: border-box;
      }
      #light {
        left: 0;
        background: white;
        color: black;
      }
      #dark {
        left: 50%;
        background: #121212;
        color: white;
      }
    </style>
  </head>
  <body>
    <section id="light">Light workspace</section>
    <section id="dark">Dark workspace</section>
  </body>
</html>
