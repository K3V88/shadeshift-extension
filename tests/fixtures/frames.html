<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Frames fixture</title>
    <style>
      body {
        background: white;
        color: black;
        font: 18px system-ui;
      }
      iframe {
        display: block;
        width: 90%;
        height: 170px;
        margin: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Same-origin and cross-origin frames</h1>
    <iframe id="same" src="/frame.html"></iframe><iframe id="cross"></iframe>
    <script>
      document.querySelector("#cross").src =
        location.origin.replace("127.0.0.1", "localhost") + "/frame.html";
    </script>
  </body>
</html>
